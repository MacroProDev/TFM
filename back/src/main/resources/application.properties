spring.application.name=back
server.port=8080

# H2 en archivo (los datos sobreviven al reiniciar)
spring.datasource.url=jdbc:h2:file:./data/rutinasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver las tablas: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true